name: ISO bauen

# Tag-Push (v*)                    → Release mit ISO und SHA256-Prüfsumme
# „Run workflow“                   → Test-Build, ISO als Artefakt (7 Tage)
# „Run workflow“ mit Release-Tag   → Release; das Tag wird dabei angelegt
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      flatpaks:
        description: Flatpaks ins ISO einbauen oder erst beim ersten Start laden
        type: choice
        options: [iso, erststart]
        default: iso
      kompression:
        description: SquashFS-Kompression (zstd = schnell, xz = klein)
        type: choice
        options: [zstd, xz]
        default: zstd
      release_tag:
        description: Optional – als Release veröffentlichen unter diesem Tag (z. B. v1.0-test1; mit Bindestrich = Vorabversion)
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: Live-ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
      EIERSCHECKE_FLATPAKS: ${{ inputs.flatpaks || 'iso' }}
      # Releases mit xz (klein), Vorabversionen (Tag mit Bindestrich) mit zstd (schnell)
      EIERSCHECKE_KOMPRESSION: ${{ inputs.kompression || (contains(github.ref_name, '-') && 'zstd' || 'xz') }}
    steps:
      - uses: actions/checkout@v4

      - name: Release-Tag prüfen
        if: env.RELEASE_TAG != ''
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -qE '^v[0-9][0-9A-Za-z.-]*$'; then
            echo "::error::Ungültiges Release-Tag: erwartet wird z. B. v1.0 oder v1.0-test1"
            exit 1
          fi

      - name: Platz auf dem Runner schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: ISO im Debian-Container bauen
        run: |
          docker run --rm --privileged \
            -v "$PWD":/eierschecke -w /eierschecke \
            -e EIERSCHECKE_FLATPAKS -e EIERSCHECKE_KOMPRESSION \
            debian:trixie bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y live-build debootstrap curl gnupg ca-certificates \
                librsvg2-bin xorriso squashfs-tools grub-efi-amd64-bin grub-pc-bin \
                mtools dosfstools cpio
              ./build.sh
            '
          sudo chown -R "$(id -u):$(id -g)" ausgabe

      - name: Hinweise aus dem Build
        if: always()
        run: |
          echo "--- Hooks, Warnungen und Fehler aus build.log ---"
          grep -nE '^(W:|E:|P: Executing hook)' build/build.log | cut -c1-300 || true
          echo "--- build-warnungen.log ---"
          sudo cat build/chroot/var/log/eierschecke-build-warnungen.log 2>/dev/null || echo "(keine)"

      - name: Build-Protokoll sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-protokoll
          path: |
            build/build.log
            ausgabe/build-warnungen.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Zusammenfassung
        run: |
          cd ausgabe
          {
            echo "## EierscheckeOS-ISO"
            echo
            echo "| Datei | Größe |"
            echo "|---|---|"
            for iso in *.iso; do echo "| \`$iso\` | $(du -h "$iso" | cut -f1) |"; done
            echo
            echo "Flatpaks: \`$EIERSCHECKE_FLATPAKS\` · Kompression: \`$EIERSCHECKE_KOMPRESSION\`"
            echo
            echo '```'
            cat ./*.sha256
            echo '```'
            if [ -s build-warnungen.log ]; then
              echo
              echo "### Hinweise aus dem Build"
              echo '```'
              cat build-warnungen.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ISO als Artefakt hochladen (Test-Build)
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: eierschecke-os-iso
          path: |
            ausgabe/*.iso
            ausgabe/*.sha256
          compression-level: 0
          retention-days: 7

      - name: Release veröffentlichen
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ausgabe
          iso="$(ls *.iso | head -n1)"
          dateien=("$iso.sha256")
          {
            echo "Live-ISO für amd64 (UEFI/Secure Boot und BIOS). Prüfsumme: \`$iso.sha256\`."
            echo
            echo "Flatpaks: \`$EIERSCHECKE_FLATPAKS\` · Kompression: \`$EIERSCHECKE_KOMPRESSION\`"
          } > ../release-notizen.md
          # GitHub erlaubt höchstens 2 GiB pro Release-Datei → größere ISOs werden geteilt.
          if [ "$(stat -c %s "$iso")" -ge $((2 * 1024 * 1024 * 1024)) ]; then
            split --bytes=1900M --numeric-suffixes=1 --suffix-length=2 "$iso" "$iso.teil-"
            dateien+=("$iso".teil-*)
            {
              echo
              echo "### ISO zusammensetzen"
              echo
              echo "Das ISO ist größer als 2 GiB und deshalb in Teile zerlegt. Alle Teile und die"
              echo "\`.sha256\`-Datei in einen Ordner laden, dann:"
              echo
              echo '```bash'
              echo "cat $iso.teil-* > $iso"
              echo "sha256sum -c $iso.sha256"
              echo '```'
              echo
              echo "Unter Windows (Eingabeaufforderung): \`copy /b $iso.teil-* $iso\`"
            } >> ../release-notizen.md
          else
            dateien+=("$iso")
          fi
          # Tags mit Bindestrich (v1.0-test1, v1.1-rc1 …) werden als Vorabversion markiert.
          vorab=()
          case "$RELEASE_TAG" in *-*) vorab=(--prerelease) ;; esac
          gh release create "$RELEASE_TAG" "${dateien[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EierscheckeOS ${RELEASE_TAG#v}" \
            --notes-file ../release-notizen.md \
            "${vorab[@]}"
