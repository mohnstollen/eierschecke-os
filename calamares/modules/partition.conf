# Standard („Festplatte löschen“): 1 GB EFI + Btrfs über den Rest, keine Verschlüsselung.
# Die Swap-Datei (Größe = RAM) legt die Nachinstallation im Subvolume @swap an.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 1024MiB
    minimumSize: 300MiB
    label: "EFI"
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 1024M

userSwapChoices: [ none ]
initialSwapChoice: none
initialPartitioningChoice: none
allowManualPartitioning: true
drawNestedPartitions: false
alwaysShowPartitionLabels: true

defaultPartitionTableType: gpt
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4" ]
enableLuksAutomatedPartitioning: false
