# dialout: MicroPython/Thonny · lpadmin: Drucker · scanner: Scanner
---
userGroup: users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
    - dialout
autologinGroup: autologin
sudoersGroup: sudo
setRootPassword: false
doAutologin: false
passwordRequirements:
    nonempty: true
    minLength: 1
user:
    shell: /bin/bash
    forbidden_names: [ root, gast ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "eierschecke-${cpu}"
    forbidden_names: [ localhost ]
