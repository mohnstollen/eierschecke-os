# Live- und Installer-Pakete aus dem installierten System entfernen.
---
backend: apt
update_db: false
update_system: false
skip_if_no_internet: false
operations:
  - try_remove:
      - live-boot
      - live-boot-doc
      - live-boot-initramfs-tools
      - live-config
      - live-config-doc
      - live-config-systemd
      - live-tools
      - calamares
