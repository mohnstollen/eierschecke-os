# EierscheckeOS – Ablauf des Calamares-Installers
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: eierschecke
  module: shellprocess
  config: shellprocess_eierschecke.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - packages
  - shellprocess@eierschecke
  - grubcfg
  - bootloader
  - initramfscfg
  - initramfs
  - umount
- show:
  - finished

branding: eierschecke
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
