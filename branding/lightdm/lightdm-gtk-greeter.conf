[greeter]
background = /usr/share/eierschecke/anmeldung.png
user-background = false
theme-name = Eierschecke-Dark
icon-theme-name = Papirus-Dark
font-name = Inter 11
xft-antialias = true
xft-hintstyle = hintslight
default-user-image = /usr/share/icons/hicolor/128x128/apps/eierschecke-logo.png
position = 50%,center 52%,center
indicators = ~host;~spacer;~clock;~spacer;~session;~language;~a11y;~power
clock-format = %A, %d. %B   %H:%M
